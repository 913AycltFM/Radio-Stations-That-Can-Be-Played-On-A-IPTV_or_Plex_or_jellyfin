name: Update 91.3 Ayclt FM EPG

on:
  # Run every 5 minutes
  schedule:
    - cron: "*/5 * * * *"

  # Allow manual runs from GitHub
  workflow_dispatch:

  # Run when these files are changed
  push:
    paths:
      - "generate_epg.py"
      - ".github/workflows/update-epg.yml"


permissions:
  contents: write


jobs:
  update-epg:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECK OUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # INSTALL PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Verify Python environment
        run: |
          python --version


      # ======================================================
      # GENERATE EPG
      # ======================================================

      - name: Generate EPG
        run: |
          python generate_epg.py


      # ======================================================
      # CHECK GENERATED FILES
      # ======================================================

      - name: Check generated EPG files
        run: |
          echo "Checking generated files..."

          test -f "91.3_Ayclt_FM_radio_guide.xml"
          test -f "epg.json"

          echo "XML file:"
          ls -lh "91.3_Ayclt_FM_radio_guide.xml"

          echo "JSON file:"
          ls -lh "epg.json"


      # ======================================================
      # VALIDATE XML
      # ======================================================

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          filename = "91.3_Ayclt_FM_radio_guide.xml"

          ET.parse(filename)

          print(f"XML validation successful: {filename}")
          PY


      # ======================================================
      # CHECK FOR CHANGES
      # ======================================================

      - name: Check for changes
        id: changes
        run: |
          git status --short

          if git diff --quiet -- \
            "91.3_Ayclt_FM_radio_guide.xml" \
            "epg.json"
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


      # ======================================================
      # COMMIT UPDATED EPG
      # ======================================================

      - name: Commit updated EPG
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "91.3_Ayclt_FM_radio_guide.xml" \
            "epg.json"

          git commit \
            -m "Update 91.3 Ayclt FM EPG"

          git push


      # ======================================================
      # NO CHANGES
      # ======================================================

      - name: No EPG changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No EPG changes detected."
