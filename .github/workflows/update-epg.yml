name: Update 91.3 Ayclt FM EPG

on:
  # Run every 5 minutes
  schedule:
    - cron: "*/5 * * * *"

  # Allow manual runs from GitHub
  workflow_dispatch:

  # Run when these files are changed
  push:
    paths:
      - "generate_epg.py"
      - ".github/workflows/update-epg.yml"


permissions:
  contents: write


# Prevent two 5-minute EPG jobs from writing the generated files
# at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  update-epg:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECK OUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # INSTALL PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Verify Python environment
        run: |
          python --version


      # ======================================================
      # GENERATE EPG
      # ======================================================

      - name: Generate EPG
        run: |
          python generate_epg.py


      # ======================================================
      # CHECK GENERATED FILES
      # ======================================================

      - name: Check generated EPG files
        run: |
          echo "Checking generated files..."

          test -f "91.3_Ayclt_FM_radio_guide.xml"
          test -f "epg.json"

          echo "XML file:"
          ls -lh "91.3_Ayclt_FM_radio_guide.xml"

          echo "JSON file:"
          ls -lh "epg.json"


      # ======================================================
      # VALIDATE XML
      # ======================================================

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          filename = "91.3_Ayclt_FM_radio_guide.xml"

          ET.parse(filename)

          print(f"XML validation successful: {filename}")
          PY


      # ======================================================
      # VALIDATE JSON AND CHANNEL COVERAGE
      # ======================================================

      - name: Validate JSON and channel coverage
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          expected = {
              "913AycltFM",
              "913AycltFMHD2",
              "913AycltFMHD3",
              "913AycltFMLiveStudioCam",
              "TheMidWestPlainsman",
          }

          with open("epg.json", encoding="utf-8") as f:
              data = json.load(f)

          if not data:
              raise SystemExit("EPG JSON is empty.")

          json_channels = {item.get("channel_id") for item in data}
          missing_json = expected - json_channels
          if missing_json:
              raise SystemExit(
                  f"EPG JSON is missing channels: {sorted(missing_json)}"
              )

          root = ET.parse("91.3_Ayclt_FM_radio_guide.xml").getroot()
          xml_channels = {
              channel.get("id")
              for channel in root.findall("channel")
          }
          missing_xml = expected - xml_channels
          if missing_xml:
              raise SystemExit(
                  f"EPG XML is missing channels: {sorted(missing_xml)}"
              )

          xml_programmes = root.findall("programme")
          if not xml_programmes:
              raise SystemExit("EPG XML contains no programmes.")

          print(
              f"JSON validation successful: {len(data)} programmes; "
              f"{len(json_channels)} channels."
          )
          print(
              f"XML validation successful: {len(xml_programmes)} programmes; "
              f"{len(xml_channels)} channels."
          )
          PY


      # ======================================================
      # CHECK FOR CHANGES
      # ======================================================

      - name: Check for changes
        id: changes
        run: |
          git status --short

          if git diff --quiet -- \
            "91.3_Ayclt_FM_radio_guide.xml" \
            "epg.json"
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


      # ======================================================
      # COMMIT UPDATED EPG
      # ======================================================

      - name: Commit updated EPG
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "91.3_Ayclt_FM_radio_guide.xml" \
            "epg.json"

          git commit \
            -m "Update 91.3 Ayclt FM EPG"

          git push


      # ======================================================
      # NO CHANGES
      # ======================================================

      - name: No EPG changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No EPG changes detected."
