name: Update 91.3 Ayclt FM EPG

on:
  # Run every 5 minutes
  schedule:
    - cron: "*/5 * * * *"

  # Allow manual runs from GitHub
  workflow_dispatch:

  # Run when these files are changed
  push:
    paths:
      - "generate_epg.py"
      - ".github/workflows/update-epg.yml"


permissions:
  contents: write


# Prevent two 5-minute EPG jobs from writing the generated files
# at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  update-epg:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECK OUT REPOSITORY
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      # ======================================================
      # INSTALL PYTHON
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Verify Python environment
        run: |
          python --version


      # ======================================================
      # GENERATE EPG
      # ======================================================

      - name: Generate EPG
        run: |
          python generate_epg.py


      # ======================================================
      # CHECK GENERATED FILES
      # ======================================================

      - name: Check generated EPG files
        run: |
          echo "Checking generated files..."

          test -f "91.3_Ayclt_FM_radio_guide.xml"
          test -f "epg.json"

          echo "XML file:"
          ls -lh "91.3_Ayclt_FM_radio_guide.xml"

          echo "JSON file:"
          ls -lh "epg.json"


      # ======================================================
      # VALIDATE XML
      # ======================================================

      - name: Validate XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          filename = "91.3_Ayclt_FM_radio_guide.xml"

          ET.parse(filename)

          print(f"XML validation successful: {filename}")
          PY


      # ======================================================
      # VALIDATE JSON AND CHANNEL COVERAGE
      # ======================================================

      - name: Validate JSON and channel coverage
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          expected = {
              "913AycltFM",
              "913AycltFMHD2",
              "913AycltFMHD3",
              "913AycltFMLiveStudioCam",
              "TheMidWestPlainsman",
          }

          with open("epg.json", encoding="utf-8") as f:
              data = json.load(f)

          if not data:
              raise SystemExit("EPG JSON is empty.")

          json_channels = {item.get("channel_id") for item in data}
          missing_json = expected - json_channels
          if missing_json:
              raise SystemExit(
                  f"EPG JSON is missing channels: {sorted(missing_json)}"
              )

          root = ET.parse("91.3_Ayclt_FM_radio_guide.xml").getroot()
          xml_channels = {
              channel.get("id")
              for channel in root.findall("channel")
          }
          missing_xml = expected - xml_channels
          if missing_xml:
              raise SystemExit(
                  f"EPG XML is missing channels: {sorted(missing_xml)}"
              )

          xml_programmes = root.findall("programme")
          if not xml_programmes:
              raise SystemExit("EPG XML contains no programmes.")

          # Every JSON programme marked live must have all mobile-friendly
          # LIVE signals in XMLTV. This keeps Android/iPhone clients useful
          # even when they do not render the graphical LIVE marker.
          live_json = {
              (
                  item.get("channel_id"),
                  item.get("start"),
                  item.get("end"),
                  item.get("title"),
              )
              for item in data
              if item.get("live") is True
          }

          live_xml = set()
          for programme in xml_programmes:
              if programme.find("live") is not None:
                  category = programme.find("category")
                  if category is None or (category.text or "").strip().upper() != "LIVE":
                      raise SystemExit(
                          "A <live/> programme is missing category=LIVE."
                      )
                  subtitle = programme.find("sub-title")
                  if subtitle is None or (subtitle.text or "").strip().upper() != "LIVE":
                      raise SystemExit(
                          "A <live/> programme is missing sub-title=LIVE."
                      )
                  title = (programme.findtext("title") or "").strip()
                  if not title.startswith("[LIVE] "):
                      raise SystemExit(
                          "A <live/> programme is missing the [LIVE] mobile title prefix."
                      )
                  live_xml.add((
                      programme.get("channel"),
                      programme.get("start"),
                      programme.get("stop"),
                      (programme.findtext("title") or "").strip(),
                  ))

          if live_json and not live_xml:
              raise SystemExit("JSON contains LIVE programmes but XML contains none.")

          print(
              f"JSON validation successful: {len(data)} programmes; "
              f"{len(json_channels)} channels."
          )
          print(
              f"XML validation successful: {len(xml_programmes)} programmes; "
              f"{len(xml_channels)} channels."
          )
          PY


      # ======================================================
      # CHECK FOR CHANGES
      # ======================================================

      - name: Check for changes
        id: changes
        run: |
          git status --short

          if git diff --quiet -- \
            "91.3_Ayclt_FM_radio_guide.xml" \
            "epg.json"
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi


      # ======================================================
      # COMMIT UPDATED EPG
      # ======================================================

      - name: Commit updated EPG
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "91.3_Ayclt_FM_radio_guide.xml" \
            "epg.json"

          git commit \
            -m "Update 91.3 Ayclt FM EPG"

          # The scheduled job can start from a slightly older main commit.
          # Rebase onto the current remote before pushing so a newer EPG
          # commit cannot cause a non-fast-forward failure.
          for attempt in 1 2 3; do
            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected. Preserving the EPG generated by this run."
              git checkout --theirs -- \
                "91.3_Ayclt_FM_radio_guide.xml" \
                "epg.json"
              git add \
                "91.3_Ayclt_FM_radio_guide.xml" \
                "epg.json"
              GIT_EDITOR=true git rebase --continue
            fi

            if git push origin HEAD:main; then
              echo "EPG push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push attempt $attempt failed because main moved. Retrying..."
            git rebase --abort 2>/dev/null || true
          done

          echo "Unable to push EPG after 3 attempts."
          exit 1


      # ======================================================
      # NO CHANGES
      # ======================================================

      - name: No EPG changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No EPG changes detected."
